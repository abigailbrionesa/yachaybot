<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">YachayBot source cards and citations</title>
  <desc id="desc">A diagram-style screenshot showing citation badges linked to source cards.</desc>
  <rect width="1200" height="720" fill="#f8faf7"/>
  <text x="80" y="90" font-family="Arial" font-size="42" font-weight="700" fill="#18251c">Source-grounded answer with citations</text>
  <rect x="80" y="140" width="520" height="430" rx="10" fill="#ffffff" stroke="#d6ded2"/>
  <text x="112" y="190" font-family="Arial" font-size="24" font-weight="700" fill="#18251c">Answer</text>
  <text x="112" y="235" font-family="Arial" font-size="18" fill="#425348">The answer cites the reviewed source card [1].</text>
  <rect x="112" y="280" width="210" height="38" rx="6" fill="#eef6eb" stroke="#b9c8b4"/>
  <text x="132" y="305" font-family="Arial" font-size="16" fill="#2f5f3d">[1] MINEDU EIB</text>
  <rect x="660" y="140" width="460" height="430" rx="10" fill="#ffffff" stroke="#d6ded2"/>
  <text x="692" y="190" font-family="Arial" font-size="24" font-weight="700" fill="#18251c">Retrieved source card</text>
  <text x="692" y="235" font-family="Arial" font-size="18" fill="#425348">Educacion intercultural bilingue en Peru</text>
  <text x="692" y="280" font-family="Arial" font-size="16" fill="#607064">official · es · Ministerio de Educacion</text>
  <text x="692" y="330" font-family="Arial" font-size="16" fill="#607064">Rights note and source URL remain visible.</text>
</svg>
